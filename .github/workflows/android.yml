name: Android Build

on:
  workflow_dispatch:

jobs:
  android:
    name: Build Electrum Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Electrum
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Android APK
        run: |
          chmod +x ./contrib/android/build.sh
          ./contrib/android/build.sh qml arm64-v8a debug

      - name: Show build output
        if: always()
        run: |
          echo "Contents of dist:"
          ls -lah dist/ || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: electrum-android-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14