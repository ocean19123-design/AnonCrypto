name: Android Build

on:
  workflow_dispatch:
    inputs:
      android_arch:
        description: Android architecture
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      APK_ARCH: ${{ inputs.android_arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/microsoft \
            /opt/pipx

      - name: Build APK
        run: ./contrib/android/build.sh qml "$APK_ARCH" debug

      - name: List APK
        run: ls -lah dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electrum-android-${{ env.APK_ARCH }}
          path: dist/*
          retention-days: 14