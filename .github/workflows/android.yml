name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARTIFACT_RETENTION: '14'
  APK_ARCH: arm64-v8a

jobs:
  android:
    name: Build Android (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/microsoft \
            /opt/pipx
          sudo docker image prune --all --force || true
          df -h

      - name: Quick QML sanity check
        run: |
          echo "Checking for known crash patterns..."

          # Pattern 1: DropShadow usage (Qt5Compat.GraphicalEffects not bundled in Android build)
          if grep -rn 'DropShadow' electrum/gui/qml/ ; then
            echo "ERROR: DropShadow found in QML — this will crash the app on Android"
            exit 1
          fi

          # Pattern 2: Assigning to read-only Material properties (colon = assignment)
          if grep -rn 'Material\.dialogColor\s*:' electrum/gui/qml/ ; then
            echo "ERROR: Material.dialogColor is read-only — this will crash the app"
            exit 1
          fi

          # Pattern 3: Report any PrefsHeading usages so we can spot check
          echo "PrefsHeading usages:"
          grep -rn 'PrefsHeading' electrum/gui/qml/components/ | head -20 || true

          # Pattern 4: Report any Heading with color set directly
          echo "Heading with color:"
          grep -rn -A2 'Heading {' electrum/gui/qml/components/ | grep 'color:' || echo "  none found"

          echo "Sanity check passed."

      - name: Cache python packages
        uses: actions/cache@v4
        with:
          path: packages
          key: android-packages-${{ env.APK_ARCH }}-${{ hashFiles('contrib/deterministic-build/**', 'contrib/make_packages.sh', 'contrib/android/**', '!contrib/android/.cache') }}

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer_qml/android/platform/build-${{ env.APK_ARCH }}/packages
            .buildozer_qml/android/platform/build-${{ env.APK_ARCH }}/build
          key: android-buildozer-${{ env.APK_ARCH }}-${{ hashFiles('contrib/android/**', '!contrib/android/.cache') }}

      - name: Build APK
        run: ./contrib/android/build.sh qml "$APK_ARCH" debug

      - name: List output
        run: ls -lah dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: electrum-android-${{ env.APK_ARCH }}
          path: dist/*
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error
          compression-level: 0